<style>
@font-face{font-family:Speedee;src:url(../fonts/Speedee-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Speedee;src:url(../fonts/Speedee-Bold-caps.woff2) format("woff2"),url(../fonts/Speedee-Bold-caps.woff) format("woff");font-weight:700;font-display:swap}
:root{--red:#da291c;--red-d:#a81d13;--yel:#ffbc0d;--ink:#292929;--mut:#5c5c5c;--bg:#fff;--soft:#fafafa;--line:#e3e3e3;--r:18px;
--surface:#fff;--f:Speedee,"Noto Sans Georgian","Sylfaen","BPG Nino Mtavruli",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-behavior:smooth}
body{font-family:var(--f);color:var(--ink);background:var(--bg);line-height:1.6;overflow-wrap:break-word;min-height:100vh;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;min-height:100vh}
main{flex:1}
img{max-width:100%;display:block}
a{color:inherit}
button,a,summary,select,input{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
:focus{outline:none}:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--yel);padding:10px 16px;z-index:200;font-weight:700}
.skip:focus{left:10px;top:10px}
h1,h2,h3{font-weight:700;line-height:1.15}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .btn,html[lang=en] .nav-l{text-transform:uppercase}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
/* header */
.hd{position:sticky;top:0;z-index:100;background:var(--red);color:#fff;padding-top:env(safe-area-inset-top,0)}
.hd .wrap{display:flex;align-items:center;gap:12px;height:68px;max-width:1440px}
.logo{display:flex;flex:none}.logo img{width:50px;height:44px;object-fit:contain}
.nav{display:flex;gap:2px;margin-left:8px;flex:1;min-width:0}
.nav-i{position:relative}
.nav-l{display:flex;align-items:center;gap:6px;padding:10px 9px;border-radius:10px;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap;transition:background .2s}
.nav-l:hover,.nav-l[aria-expanded=true],.nav-l.on{background:#ffffff26}
.nav-l svg{width:12px;height:12px;transition:transform .2s}.nav-l[aria-expanded=true] svg{transform:rotate(180deg)}
.dd{position:absolute;left:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 18px 40px #0003;padding:8px;display:none}
.dd.open{display:block;animation:in .18s}
.dd a{display:block;padding:10px 14px;border-radius:9px;text-decoration:none;font-size:15px}
.dd a:hover{background:var(--yel)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff1f;transition:background .2s}.ib:hover{background:#ffffff3d}
.ib svg{width:20px;height:20px}
.lang{display:flex;background:#ffffff1f;border-radius:30px;padding:3px}
.lang button{padding:6px 12px;border-radius:30px;font-weight:700;font-size:13px}
.lang button[aria-pressed=true]{background:var(--yel);color:var(--ink)}
.burger{display:none}
/* mobile drawer */
.drawer{position:fixed;inset:0;z-index:150;display:none}
.drawer.open{display:block}
.drawer .bk{position:absolute;inset:0;background:#0008}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(360px,92%);background:var(--surface);color:var(--ink);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0)) 18px 30px;animation:sl .25s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
.pn .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pn .ib{background:var(--soft)}
.pn details{border-bottom:1px solid var(--line)}
.pn summary,.pn>a,.pn nav>a{display:flex;justify-content:space-between;padding:15px 4px;font-weight:700;text-decoration:none;cursor:pointer;list-style:none}
.pn summary::-webkit-details-marker{display:none}
.pn summary svg{width:22px;height:22px;flex:none;transition:transform .2s}.pn details[open]>summary svg{transform:rotate(180deg)}
.pn summary{align-items:center;gap:12px}.pn details[open] summary{color:var(--red)}
.pn details a{font-size:15px;line-height:1.4}
.pn details a{display:block;padding:10px 14px;text-decoration:none;color:var(--mut)}
.pn nav>a{border-bottom:1px solid var(--line)}
/* search */
.sr{position:fixed;inset:0;z-index:160;background:#000a;display:none;padding:80px 16px}
.sr.open{display:block}
.sr .bx{max-width:640px;margin:auto;background:var(--surface);border-radius:20px;padding:18px}
.sr input{width:100%;padding:14px 18px;border:2px solid var(--line);border-radius:40px;font:inherit}
.sr input:focus{border-color:var(--red)}
.sr ul{list-style:none;margin-top:10px;max-height:50vh;overflow:auto}
.sr li a{display:block;padding:11px 12px;border-radius:10px;text-decoration:none}.sr li a:hover{background:var(--yel)}
.sr small{color:var(--mut);display:block}
/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(90deg,#8d1710ee 8%,#da291c99 60%,#da291c33),url(../images/hero-home.jpeg) center/cover;padding:clamp(54px,9vw,120px) 0}
.hero.sm{padding:clamp(40px,6vw,72px) 0;background:linear-gradient(90deg,#8d1710f2 10%,#da291ccc),url(../images/hero-menu.jpeg) center/cover}
.hero h1{font-size:clamp(34px,7vw,72px);max-width:16ch;margin-bottom:14px;text-shadow:0 3px 18px #0005}
.hero.sm h1{font-size:clamp(30px,5vw,52px);max-width:none}
.hero p{max-width:52ch;font-size:clamp(16px,2vw,19px);margin-bottom:24px;opacity:.95}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--yel);color:var(--ink);font-weight:700;padding:14px 28px;border-radius:50px;text-decoration:none;transition:transform .15s,background .2s;border:0;font-size:15px}
.btn:hover{background:#ffd04d}.btn:active{transform:scale(.96)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.btns{display:flex;gap:12px;flex-wrap:wrap}
section.s{padding:clamp(40px,6vw,72px) 0}
section.s.soft{background:var(--soft)}
h2.t{font-size:clamp(26px,4vw,40px);margin-bottom:8px;color:var(--red)}
.sub{color:var(--mut);margin-bottom:26px;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0000001a;border-color:var(--yel)}
.card:active{transform:scale(.98)}
.card h3{font-size:19px}.card p{color:var(--mut);font-size:15px}
.card .bar{height:5px;width:44px;background:var(--yel);border-radius:5px;margin-bottom:4px}
.card img{border-radius:12px;aspect-ratio:4/3;object-fit:cover;width:100%}
.note{background:var(--soft);border:2px solid var(--yel);border-radius:var(--r);padding:22px;margin:0 0 24px}
.note h3{margin-bottom:6px}.note p{margin-bottom:14px;color:var(--mut);max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 16px;border-radius:30px;border:2px solid var(--line);font-weight:700;font-size:14px;transition:.2s}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.in{width:100%;padding:13px 18px;border:2px solid var(--line);border-radius:14px;font:inherit;background:var(--surface)}
.in:focus{border-color:var(--red)}
.in.err{border-color:#c00}
.er{color:#b00020;font-size:14px;min-height:20px}
.ok{color:#1b6e2e;font-weight:700}
form.f{display:grid;gap:12px;max-width:520px}
form.f label{font-weight:700;font-size:14px}
.loc{border-left:6px solid var(--red)}
.loc a{color:var(--red);font-weight:700;text-decoration:none;margin-top:auto}
.loc a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
.calc{display:grid;gap:12px;grid-template-columns:2fr 1fr auto;align-items:end;max-width:720px}
/* footer */
.ft{background:#292929;color:#e9e9e9;padding:46px 0 calc(30px + env(safe-area-inset-bottom,0))}
.ft .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.3fr;gap:30px}
.ft h3{font-size:15px;color:var(--yel);margin-bottom:12px}
.ft a{display:block;padding:4px 0;text-decoration:none;color:#ddd}.ft a:hover{color:var(--yel)}
.ft img{width:56px;margin-bottom:10px}
.ft .fine{border-top:1px solid #444;margin-top:30px;padding-top:18px;font-size:13px;color:#aaa}
.ft .in{background:#3a3a3a;border-color:#555;color:#fff}
/* cookie */
.ck{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0));z-index:140;max-width:720px;margin:auto;background:var(--ink);color:#fff;border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 14px 40px #0006}
.ck p{flex:1;min-width:220px;font-size:14px}.ck a{color:var(--yel)}
.prose p{margin-bottom:14px;max-width:70ch}
@media(max-width:1180px){.nav,.tools .lang{display:none}.burger{display:grid}.hd .wrap{height:62px}}
@media(max-width:900px){.ft .cols{grid-template-columns:1fr 1fr}.calc{grid-template-columns:1fr}}
@media(max-width:560px){.ft .cols{grid-template-columns:1fr}.wrap{padding:0 16px}.btn{width:100%;justify-content:center}.btns{flex-direction:column}}
.pn .lang{display:flex;margin-top:18px;background:var(--soft)}.pn .lang button{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* Theme switcher */
.theme-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:24px;background:#ffffff20;color:#fff;font-weight:700;font-size:12px;white-space:nowrap;transition:background .2s}
.theme-btn:hover{background:#ffffff3d}
.theme-dot{width:14px;height:14px;border-radius:50%;display:inline-block;background:linear-gradient(135deg,#da291c 0 50%,#ffbc0d 50%);border:1px solid #ffffff99}
.theme-label{line-height:1}
.arr{display:inline-block!important;font-size:.62em;line-height:1;vertical-align:middle;margin-left:5px;font-weight:700}
html[data-theme="dark"]{--bg:#151515;--surface:#242424;--soft:#1d1d1d;--ink:#f5f5f5;--mut:#c2c2c2;--line:#444;--red:#da291c;--red-d:#a81d13;--yel:#ffbc0d}
html[data-theme="dark"] body,html[data-theme="dark"] .in{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .dd,html[data-theme="dark"] .sr .bx{background:var(--surface);color:var(--ink)}
html[data-theme="dark"] .dd a:hover,html[data-theme="dark"] .sr li a:hover{background:#393939}
html[data-theme="dark"] .note{background:#2a2618}
html[data-theme="dark"] .ft{background:#090909}
html[data-theme="green"]{--red:#176b3a;--red-d:#0d4d28;--yel:#c9ef77}
html[data-theme="green"] .hd{background:var(--red)}
html[data-theme="green"] .chip[aria-pressed=true]{background:var(--red);border-color:var(--red)}
html[data-theme="gold"]{--red:#292929;--red-d:#111;--yel:#ffbc0d}
html[data-theme="gold"] .hd{background:#292929}
html[data-theme="gold"] .hero{background:linear-gradient(90deg,#292929ed 8%,#29292999 60%,#29292933),url(../images/hero-home.jpeg) center/cover}
html[data-theme="gold"] .hero.sm{background:linear-gradient(90deg,#292929f2 10%,#292929cc),url(../images/hero-menu.jpeg) center/cover}
@media(max-width:1180px){.theme-btn{margin:14px 0 4px;color:var(--ink);background:var(--soft);width:100%;justify-content:center}.theme-btn:hover{background:var(--line)}}

</style>
</head>
